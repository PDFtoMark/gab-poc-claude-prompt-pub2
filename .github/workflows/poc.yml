name: claude-prompt-poc
on:
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  no-gate:
    runs-on: ubuntu-latest
    steps:
      - name: fork-controlled workflow step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "SECRET_FROM_BASE_REPO=[${{ secrets.POC_MARKER_SECRET }}]"
          echo "actor=${{ github.actor }} association=${{ github.event.comment.author_association }}"
          echo "ref=$GITHUB_REF"
          echo "head repo is fork: ${{ github.event.pull_request.head.repo.fork }}"
          echo "base repo: ${{ github.repository }}"
          echo "--- token perms ---"
          gh api repos/${{ github.repository }} --jq '.permissions' || true
